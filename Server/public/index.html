<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c16">
  <title>LightSync · Audience</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div id="lamp" aria-hidden="true"></div>
  <main>
    <header><span class="brand"><i aria-hidden="true"></i>LightSync</span><span class="role">AUDIENCE</span></header>
    <section id="entry">
      <div class="sound" aria-hidden="true"></div>
      <h1>この曲のラストは、<br>客席が決める。</h1>
      <form id="join"><label for="code">イベントコード</label><div class="inputrow"><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6桁のコード" required autocomplete="off"><button class="primary">参加する</button></div></form>
      <p id="hint" role="status">受付のQRコードからも参加できます。</p>
    </section>
    <section id="show" hidden>
      <div class="event"><span id="room"></span><button id="exit" class="quiet">退出</button></div>
      <div class="stage">
        <p class="kicker" id="mode"></p>
        <h1 id="title" aria-live="polite"></h1>
        <p id="detail" role="status"></p>
        <div id="options" hidden><button data-choice="solo"><b>A</b>ギターソロ</button><button data-choice="chorus"><b>B</b>客席と合唱</button></div>
      </div>
      <div class="controls"><label for="level">光の明るさ</label><input type="range" id="level" min="10" max="100" value="60"><button id="mute">自分だけ消灯</button></div>
    </section>
  </main>
</body>
</html>
